name: Build Resume PDF

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    name: Compile resume PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDF with Docker
        run: |
          docker run --rm \
            -v "$PWD:/data" \
            -w /data \
            thomasweise/docker-texlive-full:latest \
            pdflatex -interaction=nonstopmode -halt-on-error resume.tex

      - name: Commit generated PDF
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "build: update resume PDF"
          file_pattern: "*.pdf"
